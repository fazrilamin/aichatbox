name: Feature request
description: Suggest a new feature or an improvement.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Check ROADMAP.md and the open issues first; if your idea is already there, add a 👍 or a comment instead.
  - type: textarea
    id: problem
    attributes:
      label: What problem would it solve?
      description: Describe the situation on your site, not only the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
