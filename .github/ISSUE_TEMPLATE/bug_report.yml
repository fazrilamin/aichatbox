name: Bug report
description: Something doesn't work as described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Never paste API keys or tokens.** For security problems, use private reporting instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to …
        2. Ask "…"
        3. See …
    validations:
      required: true
  - type: input
    id: plugin
    attributes:
      label: Plugin version
      placeholder: "1.1.0"
    validations:
      required: true
  - type: input
    id: wp
    attributes:
      label: WordPress and PHP versions
      placeholder: "WordPress 7.1, PHP 8.2"
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: AI provider
      options:
        - OpenAI
        - Google Gemini
        - Anthropic Claude
        - DeepSeek
        - Groq
        - OpenRouter
        - Ollama
        - Other OpenAI-compatible API
        - Not relevant
    validations:
      required: true
  - type: input
    id: theme
    attributes:
      label: Theme (and page builder, if any)
  - type: textarea
    id: logs
    attributes:
      label: Errors
      description: The "Last visitor error" from AI Assistant → Dashboard, the Test connection result, browser console errors, or lines from wp-content/debug.log.
      render: text
